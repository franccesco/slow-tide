name: Check songs and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce composition rules and citations
        run: node scripts/check-song.mjs --no-write
      - name: Catalogue is up to date
        run: |
          node scripts/check-song.mjs
          git diff --exit-code songs/index.json || {
            echo "songs/index.json is stale: run node scripts/check-song.mjs and commit it"; exit 1; }

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pull request previews
        run: git fetch origin previews:refs/remotes/origin/previews || echo "no previews branch yet"
      - name: Assemble site with previews
        run: scripts/assemble-site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
