<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Lab</title>
<script>
// The lab is a view of index.html now, so a song keeps playing while the
// visitor moves between the two. This page only forwards old links:
// lab.html?song=<id> becomes index.html?view=lab&song=<id>.
(function () {
  var q = new URLSearchParams(location.search);
  q.set('view', 'lab');
  location.replace('index.html?' + q.toString());
})();
</script>
</head>
<body>
<p>The lab moved: <a href="index.html?view=lab">open it in the player</a>.</p>
</body>
</html>
